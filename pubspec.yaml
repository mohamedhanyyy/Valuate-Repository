name: valuate_app
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  flutter_animate: ^4.5.2
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  speech_to_text: ^7.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - google_fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: google_fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: google_fonts/Cairo-Light.ttf
          weight: 300
        - asset: google_fonts/Cairo-Regular.ttf
          weight: 400
        - asset: google_fonts/Cairo-Medium.ttf
          weight: 500
        - asset: google_fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Cairo-Bold.ttf
          weight: 700
        - asset: google_fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: google_fonts/Cairo-Black.ttf
          weight: 900